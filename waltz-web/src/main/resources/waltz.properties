# This file is an example
# It should be filled in and available on the classpath as /waltz.properties
# (or falling back to ~/.waltz/waltz.properties )

# Database Connectivity
database.url=jdbc:postgresql://localhost:5555/waltz
database.user=waltz
database.password=waltz
database.schema=waltztest
database.driver=org.postgresql.Driver
jooq.dialect=POSTGRES

# Database Performance
database.pool.max=16

# General Waltz Settings
waltz.from.email=dwatkins@khartec.com
waltz.base.url=http://localhost:8443/

# OAuth Settings
oauth.token_url=https://example.com/access_token
oauth.client_secret=
oauth.code_verifier=
oauth.userinfo_url=https://example.com/userinfo
oauth.redirect_uri=http://localhost:8000/
